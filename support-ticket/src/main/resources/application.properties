spring.application.name=support-ticket-service
server.port=8080

# Lee el .env de la raíz cuando corres desde IntelliJ o con ./mvnw.
# Dentro de Docker ese archivo no existe y se ignora (ahí mandan las variables de entorno del compose).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ===== Base de datos =====
# Local: PostgreSQL del docker-compose expuesto en el puerto 5435.
# En Docker se sobrescribe con SPRING_DATASOURCE_URL / USERNAME / PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5435/helpflow
spring.datasource.username=helpflow
spring.datasource.password=${DB_PASSWORD:helpflow}

# Flyway crea las tablas; Hibernate solo valida que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Seguridad JWT =====
# Sin valor por defecto a propósito: el secreto nunca queda escrito en el código
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

# ===== technician-dispatch-service =====
dispatch.base-url=${DISPATCH_BASE_URL:http://localhost:8081}
dispatch.timeout-seconds=3

# ===== SLA =====
# Porcentaje del tiempo de SLA a partir del cual el ticket se escala
sla.escalation-percentage=75
# Cada cuánto revisa el SlaScheduler (5 minutos)
sla.check-interval-ms=300000

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true
# Trazar el 100 % de las peticiones (no hay exportador: el traceId solo va a logs y ProblemDetail)
management.tracing.sampling.probability=1.0
info.app.name=support-ticket-service
info.app.description=Servicio central de tickets de soporte TI - HelpFlow

# ===== Logging estructurado (JSON) =====
# Si mientras desarrollas te cuesta leer los logs, comenta esta línea
logging.structured.format.console=ecs

# ===== Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html
