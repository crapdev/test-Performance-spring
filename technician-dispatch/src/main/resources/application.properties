spring.application.name=technician-dispatch-service
server.port=8081

# Solo salud e info: este servicio es liviano (sin base de datos ni seguridad)
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
# Recibe el traceId de support-ticket-service y lo pone en sus propios logs
management.tracing.sampling.probability=1.0
info.app.name=technician-dispatch-service
info.app.description=Simulador determinista de disponibilidad técnica - HelpFlow

# Logging estructurado (JSON)
logging.structured.format.console=ecs


